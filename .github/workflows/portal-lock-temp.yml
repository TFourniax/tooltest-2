name: portal-lock-temp

on:
  pull_request:
  push:
    branches: ["agent/idleproof-human-ci"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate exact Portal npm lockfile from pinned manifest
        shell: bash
        run: |
          mkdir -p portal-lock-gen
          cp scripts/portal-package-lock-source.json portal-lock-gen/package.json
          cd portal-lock-gen
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v6
        with:
          name: portal-package-lock
          path: portal-lock-gen/package-lock.json
          if-no-files-found: error
          retention-days: 3

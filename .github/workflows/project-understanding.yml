name: project-understanding
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-understanding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-local-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: TFourniax/tooltest
          ref: 0933d5caebc087b4f2321e283879dd2a83d54d17
          path: producer-core
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install explicit qualification dependencies
        run: python -m pip install './producer-core[structure]'
      - name: Real captured source and memory contracts
        env:
          IDLEPROOF_TEST_CORE: '1'
        run: node --test --test-concurrency=1 test/project-scan.test.mjs test/project-corpus.test.mjs test/project-navigation.test.mjs
      - name: Golden local contracts with actual Core
        run: |
          mkdir -p qualification-evidence
          node scripts/golden-contract.mjs --scope local --core producer-core --report qualification-evidence/golden.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: golden-local-contract
          path: qualification-evidence/
          if-no-files-found: error

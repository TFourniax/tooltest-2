name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: idleproof-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check critical entrypoints
        run: |
          node --check ./src/cli.mjs
          node --check ./src/learning-cli.mjs
          node --check ./src/demo.mjs
          node --check ./src/hook.mjs
          node --check ./src/context.mjs
          node --check ./src/feature-model.mjs
          node --check ./src/feature-memory.mjs
          node --check ./src/feature-review.mjs
          node --check ./src/project-model.mjs
          node --check ./src/learning.mjs
          node --check ./src/presentation.mjs
          node --check ./src/snooze.mjs
          node --check ./src/policy.mjs
          node --check ./src/provenance.mjs
          node --check ./src/attest.mjs
          node --check ./src/state.mjs
          node --check ./src/server.mjs
          node --check ./src/local-http-security.mjs
          node --check ./public/app.js
          node --check ./public/feature-review.js
      - name: Validate JSON examples and schemas
        run: |
          node -e "for (const f of ['examples/idleproof.policy.json','spec/idleproof-policy.schema.json','spec/agentic-development-provenance.schema.json','spec/change-envelope-v1.schema.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Smoke CLI
        run: node ./bin/idleproof.mjs --help
      - name: Run unit and product-journey tests
        run: npm test
      - name: Validate npm package contents
        run: npm pack --dry-run

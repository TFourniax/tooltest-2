name: test

on:
  push:
    branches: [main, "agent/idleproof-human-ci"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: idleproof-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check critical entrypoints
        run: |
          node --check ./bin/idleproof.mjs
          node --check ./src/cli.mjs
          node --check ./src/learning-cli.mjs
          node --check ./src/demo.mjs
          node --check ./src/hook.mjs
          node --check ./src/continuity-contract.mjs
          node --check ./src/continuity.mjs
          node --check ./src/context.mjs
          node --check ./src/structure-provider.mjs
          node --check ./src/semantics.mjs
          node --check ./src/explain.mjs
          node --check ./src/edition.mjs
          node --check ./src/portal-snapshot.mjs
          node --check ./src/portal-ingest-ack.mjs
          node --check ./src/portal-client.mjs
          node --check ./src/portal-assurance.mjs
          node --check ./src/portal-cli.mjs
          node --check ./src/portal-memory-sync.mjs
          node --check ./src/portal-memory-lock.mjs
          node --check ./src/feature-model.mjs
          node --check ./src/feature-memory.mjs
          node --check ./src/feature-observations.mjs
          node --check ./src/feature-lineage.mjs
          node --check ./src/feature-history.mjs
          node --check ./src/feature-review.mjs
          node --check ./src/project-model.mjs
          node --check ./src/learning.mjs
          node --check ./src/presentation.mjs
          node --check ./src/snooze.mjs
          node --check ./src/policy.mjs
          node --check ./src/provenance.mjs
          node --check ./src/attest.mjs
          node --check ./src/state.mjs
          node --check ./src/server.mjs
          node --check ./src/local-http-security.mjs
          node --check ./scripts/package-smoke.mjs
          node --check ./scripts/portal-package-smoke.mjs
          node --check ./scripts/human-smoke.mjs
          node --check ./scripts/idlebench.mjs
          node --check ./scripts/idlebench-corpus.mjs
          node --check ./scripts/explainbench.mjs
          node --check ./scripts/explain-torturebench.mjs
          node --check ./scripts/perf-gate.mjs
          node --check ./scripts/structure-core-smoke.mjs
          node --check ./scripts/structure-languages-smoke.mjs
          node --check ./scripts/structure-dependencies-smoke.mjs
          node --check ./scripts/structure-all-providers-smoke.mjs
          node --check ./scripts/structure-cold-start-diagnostics.mjs
          node --check ./scripts/feature-canonical-smoke.mjs
          node --check ./scripts/feature-lineage-smoke.mjs
          node --check ./scripts/feature-history-smoke.mjs
          node --check ./public/app.js
          node --check ./public/feature-review.js
      - name: Validate JSON examples and schemas
        run: |
          node -e "for (const f of ['examples/idleproof.policy.json','spec/idleproof-policy.schema.json','spec/agentic-development-provenance.schema.json','spec/change-envelope-v1.schema.json','spec/idleproof-portal-snapshot-v1.schema.json','spec/idleproof-portal-ingest-ack-v1.schema.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Smoke CLI
        run: node ./bin/idleproof.mjs --help
      - name: Run unit and product-journey tests
        run: npm test
      - name: Validate npm package contents
        run: npm pack --dry-run

  quality:
    name: ExplainBench + adversarial quality + performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Checkout exact Core main for live-symbol extraction
        uses: actions/checkout@v7
        with:
          repository: TFourniax/tooltest
          ref: a168829247df8e6604cf47f327be9acd3f57e155
          path: core-quality-fixture
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install exact Core with optional syntax providers outside PATH
        run: |
          python -m venv "$RUNNER_TEMP/core-quality"
          "$RUNNER_TEMP/core-quality/bin/python" -m pip install "./core-quality-fixture[structure]"
      - name: Run explain-first and optional-learning benchmarks
        run: |
          node ./scripts/explainbench.mjs
          # Live symbols require canonical extraction; the other benchmarks and budgets run without Core.
          DIFFWITNESS_BIN="$RUNNER_TEMP/core-quality/bin/dw" node ./scripts/explain-torturebench.mjs
          node ./scripts/idlebench.mjs
          node ./scripts/idlebench-corpus.mjs
      - name: Enforce local hook latency budgets
        id: perf_default
        run: node ./scripts/perf-gate.mjs
      - name: Diagnose failed quality gate without changing its result
        if: failure() && steps.perf_default.conclusion == 'failure'
        run: node ./scripts/perf-diagnostics.mjs

  core-context:
    name: real Core context consumer (${{ matrix.os }}${{ matrix.core.suffix }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # fbebc79: the task and lifecycle contract baseline this consumer was first qualified with.
        # a168829: current Core main, the Core of the PM-013 version set.
        core:
          - {ref: fbebc797968014600c1b89aed603984e15f78d5c, suffix: ''}
          - {ref: a168829247df8e6604cf47f327be9acd3f57e155, suffix: ', Core main a168829'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout exact Core ${{ matrix.core.ref }}
        uses: actions/checkout@v7
        with:
          repository: TFourniax/tooltest
          ref: ${{ matrix.core.ref }}
          path: core-context-fixture
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install exact Core CLI
        run: python -m pip install --no-deps ./core-context-fixture
      - name: Verify tasks and lifecycle through real CLI consumer
        run: node scripts/continuity-core-smoke.mjs
      - name: Verify source-bound Python extraction through real CLI consumer
        run: node scripts/structure-core-smoke.mjs
      - name: Verify native path identity through the actual Core boundary
        env:
          IDLEPROOF_REQUIRE_CANONICAL: '1'
        run: node --test test/native-path-identity.test.mjs
      - name: Verify explicit optional-language coverage without grammars
        run: node scripts/structure-languages-smoke.mjs --without-grammars
      - name: Verify all new provider families remain explicitly unparsed without grammars
        run: node scripts/structure-all-providers-smoke.mjs --without-grammars
      - name: Verify feature-map canonical imports without optional grammars
        run: node scripts/feature-canonical-smoke.mjs --without-grammars
      - name: Verify packed feature lineage through actual Core and immutable source citations
        run: node scripts/feature-lineage-smoke.mjs
      - name: Verify installed historical observations beyond eight entries
        run: node scripts/feature-history-smoke.mjs
      - name: Install exact Core optional syntax providers
        run: python -m pip install "./core-context-fixture[structure]"
      - name: Verify actual JS/TS/Go/Rust task context
        id: languages
        run: node scripts/structure-languages-smoke.mjs
      - name: Observe Windows language admission without qualifying or retrying the gate
        id: languages_diagnostic
        continue-on-error: true
        if: always() && runner.os == 'Windows' && (steps.languages.outcome == 'success' || steps.languages.outcome == 'failure')
        shell: bash
        run: |
          set -o pipefail
          node scripts/structure-pipeline-diagnostics.mjs --languages | tee "$RUNNER_TEMP/language-pipeline-observations.jsonl"
      - name: Preserve every Windows language observation
        id: languages_artifact
        continue-on-error: true
        if: always() && runner.os == 'Windows' && (steps.languages_diagnostic.outcome == 'success' || steps.languages_diagnostic.outcome == 'failure')
        uses: actions/upload-artifact@v6
        with:
          name: windows-language-pipeline-observations-${{ matrix.core.ref }}
          path: ${{ runner.temp }}/language-pipeline-observations.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: Record authoritative Windows gate and diagnostic outcomes
        if: always() && runner.os == 'Windows' && (steps.languages.outcome == 'success' || steps.languages.outcome == 'failure')
        continue-on-error: true
        env:
          GATE_OUTCOME: ${{ steps.languages.outcome }}
          PIPELINE_OUTCOME: ${{ steps.languages_diagnostic.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.languages_artifact.outcome }}
        run: node -e 'console.log(JSON.stringify({schema:"idleproof-language-diagnostic-outcomes-1",qualification:false,gate:process.env.GATE_OUTCOME,pipeline:process.env.PIPELINE_OUTCOME,artifact:process.env.ARTIFACT_OUTCOME}))'
      - name: Keep local and platform imports out of third-party dependency signals
        run: node scripts/structure-dependencies-smoke.mjs
      - name: Verify actual managed, dynamic, SQL and configuration task providers
        id: all_providers
        run: node scripts/structure-all-providers-smoke.mjs
      - name: Observe macOS YAML provider outcomes without qualifying or retrying the gate
        id: yaml_provider_diagnostic
        continue-on-error: true
        if: always() && runner.os == 'macOS' && (steps.all_providers.outcome == 'success' || steps.all_providers.outcome == 'failure')
        run: node scripts/structure-provider-diagnostics.mjs
      - name: Observe complete macOS source admission and provider sequence without qualification
        id: source_pipeline_diagnostic
        continue-on-error: true
        if: always() && runner.os == 'macOS' && (steps.all_providers.outcome == 'success' || steps.all_providers.outcome == 'failure')
        shell: bash
        run: |
          set -o pipefail
          node scripts/structure-pipeline-diagnostics.mjs | tee "$RUNNER_TEMP/source-pipeline-observations.jsonl"
      - name: Preserve every complete-pipeline observation
        id: source_pipeline_artifact
        continue-on-error: true
        if: always() && runner.os == 'macOS' && (steps.source_pipeline_diagnostic.outcome == 'success' || steps.source_pipeline_diagnostic.outcome == 'failure')
        uses: actions/upload-artifact@v6
        with:
          name: macos-source-pipeline-observations-${{ matrix.core.ref }}
          path: ${{ runner.temp }}/source-pipeline-observations.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: Record authoritative gate and diagnostic outcomes
        if: always() && runner.os == 'macOS' && (steps.all_providers.outcome == 'success' || steps.all_providers.outcome == 'failure')
        continue-on-error: true
        env:
          GATE_OUTCOME: ${{ steps.all_providers.outcome }}
          YAML_OUTCOME: ${{ steps.yaml_provider_diagnostic.outcome }}
          PIPELINE_OUTCOME: ${{ steps.source_pipeline_diagnostic.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.source_pipeline_artifact.outcome }}
        run: node -e 'console.log(JSON.stringify({schema:"idleproof-diagnostic-outcomes-1",qualification:false,gate:process.env.GATE_OUTCOME,yaml:process.env.YAML_OUTCOME,pipeline:process.env.PIPELINE_OUTCOME,artifact:process.env.ARTIFACT_OUTCOME}))'
      - name: Verify cited canonical feature-map references and fresh source reads
        run: node scripts/feature-canonical-smoke.mjs
      - name: Enforce existing hook budgets with actual Python provider
        id: perf_python
        if: runner.os == 'Linux'
        run: node scripts/perf-gate.mjs --python-core
      - name: Diagnose failed Python gate without changing its result
        if: failure() && steps.perf_python.conclusion == 'failure'
        run: node scripts/perf-diagnostics.mjs --python-core
      - name: Enforce existing hook budgets with actual TypeScript provider
        id: perf_typescript
        if: runner.os == 'Linux'
        run: node scripts/perf-gate.mjs --syntax-core
      - name: Diagnose failed TypeScript gate without changing its result
        if: failure() && steps.perf_typescript.conclusion == 'failure'
        run: node scripts/perf-diagnostics.mjs --syntax-core
      - name: Enforce existing hook budgets with actual configuration provider
        id: perf_json
        if: runner.os == 'Linux'
        run: node scripts/perf-gate.mjs --data-core
      - name: Diagnose failed JSON gate without changing its result
        if: failure() && steps.perf_json.conclusion == 'failure'
        run: node scripts/perf-diagnostics.mjs --data-core

  core-cold-start:
    name: Core first-extraction phases (${{ matrix.os }}, diagnostic, non-qualifying)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout exact Core main
        uses: actions/checkout@v7
        with:
          repository: TFourniax/tooltest
          ref: a168829247df8e6604cf47f327be9acd3f57e155
          path: core-cold-fixture
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Observe the first extraction after fresh installs (no retries, every outcome retained)
        shell: bash
        run: |
          set -o pipefail
          node scripts/structure-cold-start-diagnostics.mjs --core ./core-cold-fixture | tee "$RUNNER_TEMP/cold-start-observations.jsonl"
      - name: Preserve every cold-start observation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-cold-start-observations-${{ matrix.os }}
          path: ${{ runner.temp }}/cold-start-observations.jsonl
          if-no-files-found: error
          retention-days: 30

  core-memory-export:
    name: real Core paged memory export (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout exact Core with forward journal pages
        uses: actions/checkout@v7
        with:
          repository: TFourniax/tooltest
          ref: 01288e4deb3ea7e68250e04285953d9b3a2d9617
          path: core-memory-fixture
          persist-credentials: false
      - name: Checkout exact Core main without journal pages
        uses: actions/checkout@v7
        with:
          repository: TFourniax/tooltest
          ref: 956f79840f7c2146ae9d565f4fafd9f5018d21a6
          path: core-legacy-fixture
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify paged export through the real Core CLI
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/core-paged"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/core-paged/Scripts"; else BIN="$RUNNER_TEMP/core-paged/bin"; fi
          "$BIN/python" -m pip install --no-deps ./core-memory-fixture
          PATH="$BIN:$PATH" node scripts/portal-memory-core-smoke.mjs
      - name: Verify declared fallback with Core lacking journal pages
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/core-legacy"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/core-legacy/Scripts"; else BIN="$RUNNER_TEMP/core-legacy/bin"; fi
          "$BIN/python" -m pip install --no-deps ./core-legacy-fixture
          PATH="$BIN:$PATH" node scripts/portal-memory-core-smoke.mjs --legacy

  package-e2e:
    name: installed package commercial-alpha journey (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pack, install, configure and uninstall exact npm artifact
        run: node ./scripts/package-smoke.mjs
      - name: Exercise exact npm artifact over real Portal HTTP transport
        run: node ./scripts/portal-package-smoke.mjs
      - name: Exercise first-run, live learning, exact change identity, handoff and restart as a user
        run: node ./scripts/human-smoke.mjs

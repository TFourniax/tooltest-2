# Example consumer workflow. Commit/provision only the PUBLIC recorder/org trust key.
name: agentic-evidence
on: [pull_request]
permissions:
  contents: read
jobs:
  verify-agentic-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: TFourniax/tooltest-2@main
        with:
          attestation: .idleproof/attestation.dsse.json
          public-key: .idleproof-trust/team-recorder.pub.pem
